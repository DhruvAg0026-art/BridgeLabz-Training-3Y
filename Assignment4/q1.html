<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 1 - Embedded YouTube Video</title>
</head>
<body>
    <!-- This page embeds a YouTube video using an iframe -->
    <h1>YouTube Video</h1>
    <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="Sample YouTube Video"
        width="80%"
        height="60%"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
    </iframe>
</body>
</html>
