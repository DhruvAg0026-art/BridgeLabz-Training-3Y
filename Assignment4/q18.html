<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quotes Example</title>
</head>
<body>
    <h1>Quotes</h1>
    <blockquote>
        Success is the sum of small efforts, repeated day in and day out. The journey may be long, but consistency creates greatness.
    </blockquote>

    <p>
        As the saying goes, <q>Practice makes progress.</q> This reminds us that hard work &amp; dedication lead to improvement.
    </p>
</body>
</html>
