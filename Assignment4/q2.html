<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 2 - Embedded Google Map</title>
</head>
<body>
    <!-- This page shows a Google Map with lazy loading enabled -->
    <h1>My School / City Map</h1>
    <iframe
        src="https://www.google.com/maps?q=India&output=embed"
        title="Map of India"
        width="90%"
        height="450"
        loading="lazy">
    </iframe>
    <!-- The loading attribute tells the browser to load the iframe only when needed,
         which helps save bandwidth and improves page performance. -->
</body>
</html>
