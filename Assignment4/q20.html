<!DOCTYPE html>
<html lang="en">
<head>
    <!-- This tag sets the character encoding for the webpage. -->
    <meta charset="UTF-8">

    <!-- This tag provides a brief description of the webpage for search engines and browsers. -->
    <meta name="description" content="Sample HTML head elements demonstration">

    <!-- This tag stores information about the author of the web page. -->
    <meta name="author" content="Student Name">

    <!-- This tag sets the default base URL for relative links in the page. -->
    <base href="https://example.com/">

    <!-- This tag links a favicon or other external resource for the page. -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- This tag defines the page title shown in the browser tab. -->
    <title>HTML Head Elements</title>

    <!-- This empty style tag is included to show where CSS can be placed. -->
    <style></style>

    <!-- This empty script tag is included to show where JavaScript can be placed. -->
    <script></script>
</head>
<body>
    <h1>Head Section Example</h1>
    <p>This page demonstrates the important elements used inside the document head.</p>
</body>
</html>
