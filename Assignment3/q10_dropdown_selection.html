<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown Selection Page</title>
</head>
<body>

    <h1>Travel Preference Selector</h1>

    <form action="#" method="post">

        <!-- Country dropdown with pre-selected option -->
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="usa">USA</option>
            <option value="india" selected>India</option>
            <option value="japan">Japan</option>
            <option value="france">France</option>
        </select>
        <br><br>

        <!-- State dropdown with pre-selected option -->
        <label for="state">State:</label>
        <select id="state" name="state">
            <option value="maharashtra" selected>Maharashtra</option>
            <option value="kerala">Kerala</option>
            <option value="rajasthan">Rajasthan</option>
            <option value="punjab">Punjab</option>
        </select>
        <br><br>

        <!-- City dropdown with pre-selected option -->
        <label for="city">City:</label>
        <select id="city" name="city">
            <option value="mumbai">Mumbai</option>
            <option value="pune" selected>Pune</option>
            <option value="nagpur">Nagpur</option>
            <option value="nashik">Nashik</option>
        </select>
        <br><br>

        <!-- Favorite tourist place dropdown with pre-selected option -->
        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option value="shaniwarwada" selected>Shaniwar Wada</option>
            <option value="sinhagad">Sinhagad Fort</option>
            <option value="parvati">Parvati Hill</option>
            <option value="dagdusheth">Dagdusheth Temple</option>
        </select>
        <br><br>

        <input type="submit" value="Submit Choices">

    </form>

    <!-- Paragraph summarizing the selections -->
    <p>
        Based on the pre-selected options above, the chosen destination is
        Pune, Maharashtra, India, with Shaniwar Wada as the favorite tourist place.
    </p>

</body>
</html>
