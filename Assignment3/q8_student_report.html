<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>

    <!-- School name -->
    <h1>Springfield Public High School</h1>
    <h2>Student Report Card</h2>

    <p>Student Name: John Doe | Roll No: 24 | Class: 10-A</p>

    <!-- Marks table -->
    <table border="1" cellpadding="6" title="Student Marks Table">
        <thead>
            <tr>
                <th title="Subject Name">Subject</th>
                <th title="Marks obtained out of maximum marks">Marks Obtained</th>
                <th title="Maximum possible marks">Maximum Marks</th>
                <th title="Grade awarded for the subject">Grade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>English</td>
                <td>82</td>
                <td>100</td>
                <td>A</td>
            </tr>
            <tr>
                <td>Mathematics</td>
                <td>91</td>
                <td>100</td>
                <td>A+</td>
            </tr>
            <tr>
                <td>Science</td>
                <td>78</td>
                <td>100</td>
                <td>B+</td>
            </tr>
            <tr>
                <td>Social Studies</td>
                <td>85</td>
                <td>100</td>
                <td>A</td>
            </tr>
            <tr>
                <td>Computer Science</td>
                <td>95</td>
                <td>100</td>
                <td>A+</td>
            </tr>

            <!-- Total and Percentage row using colspan/rowspan -->
            <tr>
                <td colspan="2" title="Sum of marks obtained across all subjects">Total: 431</td>
                <td colspan="2" title="Overall percentage score">Percentage: 86.2%</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
