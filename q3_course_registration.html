<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration Form</title>
</head>
<body>

    <h1>Course Registration Form</h1>

    <form action="#" method="post">

        <!-- Fieldset for personal details -->
        <fieldset>
            <legend>Personal Details</legend>

            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name"><br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
        </fieldset>

        <br>

        <!-- Fieldset for course selection -->
        <fieldset>
            <legend>Course Selection</legend>

            <label for="course">Select a Course:</label>
            <select id="course" name="course">
                <option value="html">Web Development - HTML/CSS</option>
                <option value="python">Programming with Python</option>
                <option value="data">Data Science Fundamentals</option>
                <option value="design">UI/UX Design</option>
            </select>
        </fieldset>

        <br>

        <input type="submit" value="Register">

    </form>

    <!-- Table showing available course schedules -->
    <h2>Available Course Schedules</h2>
    <table border="1" cellpadding="6">
        <thead>
            <tr>
                <th>Day</th>
                <th>Time</th>
                <th>Instructor</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Monday</td>
                <td>10:00 AM - 12:00 PM</td>
                <td>Ms. Alice Turner</td>
            </tr>
            <tr>
                <td>Wednesday</td>
                <td>2:00 PM - 4:00 PM</td>
                <td>Mr. David Kim</td>
            </tr>
            <tr>
                <td>Friday</td>
                <td>9:00 AM - 11:00 AM</td>
                <td>Dr. Priya Sharma</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
