<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>
    <main class="photo-page"><header><p class="eyebrow">A field guide</p><h1>Light, land, and leaving.</h1></header><section class="photo-grid" aria-label="Photo gallery">
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="Person walking toward a mountain lake"></div><figcaption>01 / First light</figcaption></figure>
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Misty green mountain valley"></div><figcaption>02 / The long valley</figcaption></figure>
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Snowy mountain peaks under blue sky"></div><figcaption>03 / Higher ground</figcaption></figure>
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=900&q=80" alt="Open road crossing a desert landscape"></div><figcaption>04 / Open road</figcaption></figure>
        <figure><div class="photo"><img src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=900&q=80" alt="Sunlight through a deep forest"></div><figcaption>05 / Into the green</figcaption></figure>
    </section></main>

</html>
