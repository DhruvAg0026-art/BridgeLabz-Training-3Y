<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Form</title><link rel="stylesheet" href="q9.css">
</head>
<body>
    <main><section class="form-panel"><p class="kicker">A considered response</p><h1>Outline and Focus</h1><p>Focus the fields to see their accessible outline treatment.</p><form><label for="name">Your name</label><input id="name" type="text" placeholder="Aarav Mehta"><label for="email">Email address</label><input id="email" type="email" placeholder="name@example.com"><label for="message">Message</label><textarea id="message" rows="5" placeholder="Write a short note..."></textarea><button type="submit">Send message</button></form></section></main>
</body>
</html>
