<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title><link rel="stylesheet" href="q2.css">
</head>
<body>
    <main class="layout"><header><p class="kicker">Sizing lab</p><h1>Height and Width Practice</h1><p>Each panel uses a different sizing constraint.</p></header>
        <section class="size-row" aria-label="Size examples">
            <article class="size-box px-box"><h2>Pixels</h2><p>280px wide<br>180px tall</p></article>
            <article class="size-box percent-box"><h2>Percent</h2><p>70% wide<br>min-height applied</p></article>
            <article class="size-box viewport-box"><h2>Viewport + em</h2><p>18vh tall<br>max-width: 18em<br>overflow: auto</p></article>
        </section>
    </main>
</body>
</html>
